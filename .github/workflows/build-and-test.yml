name: build-and-test

# Build the railway provider from the pinned GraphQL introspection schema and
# run every token-free test layer on each push / PR; the live smoke suite runs
# only where RAILWAY_TOKEN is configured; a scheduled schema-drift job
# compares the served schema with the pin (Railway deploys continuously -
# drift is expected and must be reviewed, never silent).

on:
  push:
    branches: [main, 'feature/**']
    paths-ignore: ['website/**']
  pull_request:
    branches: [main]
    paths-ignore: ['website/**']
  schedule:
    - cron: '23 4 * * 1'   # weekly schema-drift check (Monday 04:23 UTC)
  workflow_dispatch:

jobs:
  build-and-test:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # the mapping stability gate reads the committed all_services.csv

      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      # puts the latest stackql on PATH; bin/start-server.sh and the test
      # runners resolve it from there
      - name: Install stackql
        uses: stackql/setup-stackql@v2

      - name: stackql version
        run: stackql --version

      # Drift is reported, not fatal, here: the committed pin is what gets
      # built and tested. The schema-drift job below opens the review issue.
      - name: Verify the pinned schema against the API (warns on drift)
        run: |
          if ! make fetch-schema; then
            echo "::warning title=Railway GraphQL schema drift::The served introspection schema no longer matches provider-dev/config/schema_pin.json - run 'make refresh-schema && make inventory generate && make test' and review the diff. Building from the committed pin."
          fi

      # fails when a committed operation mapping would change (a resource
      # renamed, a method moved): published queries depend on those names
      - name: Build provider from the pinned schema (mapping stability gate)
        run: make inventory generate

      - name: Fail on uncommitted generation drift
        run: |
          git add -N .
          if ! git diff --quiet -- provider-dev/openapi provider-dev/config; then
            echo "Generated output differs from the committed artifacts - run 'make inventory generate' and commit."
            git diff --stat -- provider-dev/openapi provider-dev/config
            exit 1
          fi

      - name: Offline validation
        run: make test-offline

      - name: Integration tests (mock Railway GraphQL server)
        run: make test-integration

      - name: Meta-route tests
        run: make test-meta

      - name: Generate docs (sanity - the site build runs on the web workflows)
        run: make docs

  smoke:
    # secret-gated live smoke suite; skipped with a notice when the token is
    # not configured (forks, PRs from outside). The suite creates one empty
    # project named stackql-smoke-<stamp>, deploys nothing, and deletes the
    # project; it sweeps stackql-smoke-* projects before and after.
    runs-on: ubuntu-latest
    needs: build-and-test
    if: github.event_name != 'pull_request' && github.event_name != 'schedule'
    concurrency:
      group: railway-live-smoke   # one run at a time: the hourly rate limit is shared
      cancel-in-progress: false
    env:
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
      RAILWAY_SMOKE_WORKSPACE_ID: ${{ secrets.RAILWAY_SMOKE_WORKSPACE_ID }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: npm ci

      - name: Live smoke suite (reads + the free project lifecycle)
        if: env.RAILWAY_TOKEN != ''
        run: make smoke

      - name: Sweep smoke projects (always, after a live run)
        if: always() && env.RAILWAY_TOKEN != ''
        run: make smoke-cleanup

      - name: Live smoke skipped (no credentials)
        if: env.RAILWAY_TOKEN == ''
        run: |
          echo "::notice title=Live smoke suite skipped::RAILWAY_TOKEN secret is not configured - the live smoke suite did not run. Token-free coverage still ran via the mock-server integration suite."

  schema-drift:
    # Compare the served introspection schema with the pin on a schedule and
    # on demand, and open an issue when it moves.
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Fetch and compare against the pin
        id: drift
        run: |
          set +e
          make fetch-schema > fetch.log 2>&1
          rc=$?
          set -e
          cat fetch.log
          if [ "$rc" -eq 0 ]; then
            echo "drift=false" >> "$GITHUB_OUTPUT"
          else
            echo "drift=true" >> "$GITHUB_OUTPUT"
            # materialise the diff for the issue body (refresh into the working tree only)
            npm run fetch-schema -- --update > /dev/null 2>&1 || true
            npm run build-inventory > /dev/null 2>&1 || true
            git diff --stat -- provider-dev/config > drift.txt || true
            git diff --unified=0 -- provider-dev/config/operation_inventory.csv | grep -E '^[+-][^+-]' | cut -c1-200 | head -60 >> drift.txt || true
            cat drift.txt
          fi

      - name: Report drift
        if: steps.drift.outputs.drift == 'true'
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require('fs');
            const stat = fs.existsSync('drift.txt') ? fs.readFileSync('drift.txt', 'utf8') : '(diff unavailable)';
            const title = 'Railway GraphQL schema drift detected';
            const body = 'The introspection schema served at https://backboard.railway.com/graphql/v2 no longer matches the pin in provider-dev/config/schema_pin.json.\n\n```\n' + stat + '\n```\nRun `make refresh-schema && make inventory generate && make test`, review the inventory and all_services.csv diffs (removed or moved operations fail `make generate` until accepted with `make generate-accept`; new operations need a service rule when they land in `misc`), run `make validate-live` and `make smoke`, update NOTES.md, and commit.';
            await core.summary.addHeading(title).addCodeBlock(stat).write();
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo, state: 'open', labels: 'schema-drift'
            });
            if (issues.some(i => i.title === title)) return;
            await github.rest.issues.create({
              owner: context.repo.owner, repo: context.repo.repo, title, body, labels: ['schema-drift']
            });
